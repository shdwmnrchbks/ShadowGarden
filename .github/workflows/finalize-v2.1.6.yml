name: Finalize v2.1.6

on:
  push:
    branches:
      - fix-search-grid-track-v2.1.6
    paths:
      - ".github/workflows/finalize-v2.1.6.yml"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix-search-grid-track-v2.1.6
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Apply v2.1.6 grid-track fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          css_path = Path('src/assets/css/library-features.css')
          css = css_path.read_text()
          replacements = [
            (
              '.search-stack{display:grid;gap:6px}',
              '.search-stack{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}'
            ),
            (
              '.filters,.search-stack,.search-field,.filter-group{width:100%}.search-field{overflow:hidden}',
              '.filters,.search-stack,.search-field,.filter-group{width:100%}.filters{grid-template-columns:minmax(0,1fr)}.search-field{overflow:hidden}'
            ),
            (
              '.active-filter-tags{display:flex;flex-wrap:wrap;gap:6px;min-height:0}',
              '.active-filter-tags{display:flex;flex-wrap:wrap;gap:6px;min-width:0;max-width:100%;min-height:0}'
            ),
            (
              '@media(max-width:980px){.recent-volumes{grid-template-columns:repeat(4,minmax(0,1fr))}.recent-volume:nth-child(n+5){display:none}.search-stack,.filter-tags{grid-column:1/-1}.filters.filters-collapsed{display:block}}',
              '@media(max-width:980px){.recent-volumes{grid-template-columns:repeat(4,minmax(0,1fr))}.recent-volume:nth-child(n+5){display:none}.filters{grid-template-columns:repeat(3,minmax(0,1fr))}.search-stack,.filter-tags{grid-column:1/-1}.filters.filters-collapsed{display:block}}'
            ),
            (
              '  .catalog-layout{row-gap:14px}\n',
              '  .catalog-layout{row-gap:14px}\n  .filters{grid-template-columns:minmax(0,1fr)}\n'
            ),
          ]
          for old, new in replacements:
            if old not in css:
              raise SystemExit(f'missing CSS marker: {old}')
            css = css.replace(old, new, 1)
          css_path.write_text(css)

          test_path = Path('tests/browser/library-filter-ux.test.mjs')
          test = test_path.read_text()
          old = '''  assert.match(css,/\\.search-field input\\{flex:1 1 0;width:0;min-width:0;max-width:100%\\}/);\n  assert.match(css,/\\.filter-group select\\{width:100%;min-width:0;max-width:100%\\}/);\n  assert.equal(css.includes(".search-field input,.filter-group select{width:100%"),false,"Search input must not claim the full flex row width alongside icon/toggle siblings");'''
          new = '''  assert.match(css,/\\.search-field input\\{flex:1 1 0;width:0;min-width:0;max-width:100%\\}/);\n  assert.match(css,/\\.filter-group select\\{width:100%;min-width:0;max-width:100%\\}/);\n  assert.match(css,/\\.search-stack\\{display:grid;grid-template-columns:minmax\\(0,1fr\\);gap:6px\\}/);\n  assert.match(css,/\\.filters\\{grid-template-columns:minmax\\(0,1fr\\)\\}/);\n  assert.match(css,/@media\\(max-width:980px\\)\\{[^}]*\\.filters\\{grid-template-columns:repeat\\(3,minmax\\(0,1fr\\)\\)\\}/);\n  assert.match(css,/@media\\(max-width:720px\\)\\{[\\s\\S]*?\\.filters\\{grid-template-columns:minmax\\(0,1fr\\)\\}/);\n  assert.match(css,/\\.active-filter-tags\\{display:flex;flex-wrap:wrap;gap:6px;min-width:0;max-width:100%;min-height:0\\}/);\n  assert.equal(css.includes(".search-field input,.filter-group select{width:100%"),false,"Search input must not claim the full flex row width alongside icon/toggle siblings");'''
          if old not in test:
            raise SystemExit('missing test marker')
          test_path.write_text(test.replace(old, new, 1))

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text()
          heading = '# Shadow Garden Changelog\n'
          if not text.startswith(heading):
            raise SystemExit('unexpected changelog heading')
          entry = '''\n## 2.1.6 — Search Grid Track Containment\n- Fixed the remaining long-query Search/Filter expansion by replacing intrinsic `auto` grid tracks with shrinkable `minmax(0,1fr)` tracks.\n- Applied shrink-safe filter tracks on desktop, tablet, and mobile while preserving the existing responsive column counts.\n- Constrained the active-filter pill rail so an unbroken Search pill cannot contribute an oversized intrinsic width.\n- Strengthened browser regression coverage for grid-track-level long-query containment.\n'''
          changelog.write_text(heading + entry + text[len(heading):])
          PY
          npm version 2.1.6 --no-git-tag-version
          git rm .github/workflows/finalize-v2.1.6.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/css/library-features.css tests/browser/library-filter-ux.test.mjs CHANGELOG.md package.json package-lock.json
          git commit -m "Fix long-query filter grid tracks for v2.1.6"
          git push origin HEAD:fix-search-grid-track-v2.1.6
