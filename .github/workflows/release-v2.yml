name: Publish Shadow Garden v2

on:
  workflow_run:
    workflows:
      - Verify Shadow Garden
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: shadow-garden-v2-release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout verified main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Resolve v2 release metadata
        id: release
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          VERSION="$(jq -r '.version' package.json)"
          if ! printf '%s' "$VERSION" | grep -Eq '^2\.[0-9]+\.[0-9]+$'; then
            echo "Shadow Garden package version $VERSION is outside the v2 release line."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          NOTES="docs/releases/v${VERSION}.md"
          if [ ! -f "$NOTES" ]; then
            echo "Missing release notes: $NOTES" >&2
            exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

      - name: Check whether GitHub release already exists
        id: existing
        if: steps.release.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG already exists; leaving the verified release unchanged."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require matching Real Browser E2E
        if: steps.release.outputs.publish == 'true' && steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.release.outputs.head_sha }}
        run: |
          matched=false
          for attempt in $(seq 1 90); do
            runs="$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/e2e.yml/runs" \
              -f branch=main \
              -f event=push \
              -f head_sha="$HEAD_SHA" \
              -f per_page=10)"
            run="$(printf '%s' "$runs" | jq -c '.workflow_runs | sort_by(.run_number) | last // empty')"
            if [ -z "$run" ]; then
              echo "Real Browser E2E attempt $attempt: no main push run for $HEAD_SHA yet."
              sleep 20
              continue
            fi

            status="$(printf '%s' "$run" | jq -r '.status // empty')"
            conclusion="$(printf '%s' "$run" | jq -r '.conclusion // empty')"
            url="$(printf '%s' "$run" | jq -r '.html_url // empty')"
            echo "Real Browser E2E attempt $attempt: status=${status:-unknown} conclusion=${conclusion:-pending} ${url:-}"

            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                matched=true
                break
              fi
              echo "Real Browser E2E completed with ${conclusion:-unknown} for $HEAD_SHA." >&2
              exit 1
            fi
            sleep 20
          done
          if [ "$matched" != "true" ]; then
            echo "Real Browser E2E never completed successfully for main commit $HEAD_SHA." >&2
            exit 1
          fi

      - name: Wait for matching Cloudflare production deployment
        if: steps.release.outputs.publish == 'true' && steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          HEAD_SHA: ${{ steps.release.outputs.head_sha }}
          PRODUCTION: https://shadowgarden-bon.pages.dev
        run: |
          matched=false
          for attempt in $(seq 1 40); do
            metadata="$(curl --silent --show-error --fail --max-time 15 "$PRODUCTION/data/version.json" 2>/dev/null || true)"
            deployed_version="$(printf '%s' "$metadata" | jq -r '.version // empty' 2>/dev/null || true)"
            deployed_commit="$(printf '%s' "$metadata" | jq -r '.commit // empty' 2>/dev/null || true)"
            echo "Production attempt $attempt: version=${deployed_version:-unavailable} commit=${deployed_commit:-unavailable}"
            if [ "$deployed_version" = "$VERSION" ] && [ "$deployed_commit" = "$HEAD_SHA" ]; then
              matched=true
              break
            fi
            sleep 15
          done
          if [ "$matched" != "true" ]; then
            echo "Production never reported v$VERSION at commit $HEAD_SHA." >&2
            exit 1
          fi

      - name: Smoke public production surfaces
        if: steps.release.outputs.publish == 'true' && steps.existing.outputs.exists != 'true'
        env:
          PRODUCTION: https://shadowgarden-bon.pages.dev
        run: |
          smoke_dir="$(mktemp -d)"
          trap 'rm -rf "$smoke_dir"' EXIT

          smoke_page() {
            path="$1"
            marker="$2"
            file="$smoke_dir/page.html"
            echo "Smoke $PRODUCTION$path"
            curl --silent --show-error --fail --location --max-time 20 \
              --output "$file" "$PRODUCTION$path"
            grep -Fq "$marker" "$file"
          }

          smoke_page / 'data-library-scope="main"'
          smoke_page /nsfw.html 'data-library-scope="nsfw"'
          smoke_page /series.html 'id="seriesRoot"'
          smoke_page /reader.html 'id="viewer"'

          robots="$smoke_dir/robots.txt"
          curl --silent --show-error --fail --location --max-time 20 \
            --output "$robots" "$PRODUCTION/robots.txt"
          grep -Fq 'Disallow: /media/' "$robots"

      - name: Publish verified GitHub v2 release
        if: steps.release.outputs.publish == 'true' && steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          HEAD_SHA: ${{ steps.release.outputs.head_sha }}
          NOTES: ${{ steps.release.outputs.notes }}
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$HEAD_SHA" \
            --title "Shadow Garden $TAG" \
            --notes-file "$NOTES"
