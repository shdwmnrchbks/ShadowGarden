name: Real Browser E2E

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: playwright (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - project: chromium-desktop
            browser: chromium
          - project: firefox-desktop
            browser: firefox
          - project: webkit-desktop
            browser: webkit
          - project: chromium-mobile
            browser: chromium
          - project: webkit-mobile
            browser: webkit
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tests/e2e/package-lock.json
      - name: Install production/build dependencies
        run: npm ci --no-audit --no-fund --progress=false
      - name: Install E2E dependencies
        run: npm ci --prefix tests/e2e --no-audit --no-fund --progress=false
      - name: Build production output
        run: npm run build:dist
      - name: Generate Reader EPUB fixture
        working-directory: tests/e2e
        run: node support/build-reader-fixture.mjs
      - name: Install Playwright browser
        run: npm exec --prefix tests/e2e -- playwright install --with-deps ${{ matrix.browser }}
      - name: Run real-browser suite
        working-directory: tests/e2e
        run: npx playwright test --project=${{ matrix.project }}
      - name: Upload Playwright artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shadow-garden-playwright-${{ matrix.project }}-${{ github.run_id }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14
