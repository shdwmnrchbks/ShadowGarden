name: Verify Shadow Garden

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Pure Node.js: let GitHub dispatch to any x64 self-hosted runner. Node is
    # reused from the runner tool cache, and npm reuses the machine-local cache.
    runs-on: [self-hosted, X64]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund --progress=false
      - name: Check repository
        run: npm run check
      - name: Build production output
        run: npm run build
