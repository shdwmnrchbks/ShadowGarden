<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <meta name="theme-color" content="#0b0910">
  <title>Reader — Shadow Garden</title>
  <link rel="icon" href="/assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/reader.css">
  <link rel="stylesheet" href="/assets/css/reader-continuous-rail.css?v=1.3.0">
  <link rel="stylesheet" href="/assets/css/reader-page-map.css?v=1.2.0">
  <link rel="stylesheet" href="/assets/css/reader-polish.css">
  <link rel="stylesheet" href="/assets/css/reader-end-page.css?v=1.8.0">
  <link rel="stylesheet" href="/assets/css/reader-a11y.css">
  <link rel="stylesheet" href="/assets/css/reader-interface-themes.css?v=1.5.0">
  <link rel="stylesheet" href="/assets/css/ui-symbols.css?v=1.6.0">
  <script src="/assets/vendor/jszip.min.js"></script>
  <script src="/assets/vendor/epub.min.js"></script>
  <script src="/assets/js/data-source.js"></script>
  <script src="/assets/js/book-access.js?v=2"></script>
  <script src="/assets/js/reader-continuous-rail.js"></script>
  <script src="/assets/js/reader-epub-adapter.js"></script>
  <script src="/assets/js/reader-visual-cache.js?v=1.3.0"></script>
  <script src="/assets/js/reader-paginated-visual-fit.js?v=1.4.3"></script>
  <script src="/assets/js/reader-continuous-core.js?v=1.4.1"></script>
  <script src="/assets/js/reader-gesture-hook.js"></script>
  <script src="/assets/js/reader-polish.js" defer></script>
  <script src="/assets/js/reader-a11y.js" defer></script>
  <script src="/assets/js/ui-direction-triangles.js?v=1.8.0" defer></script>
  <script src="/assets/js/reader-wheel-pages.js?v=1.6.0" defer></script>
  <script type="module" src="/assets/js/reader-bootstrap.js?v=2"></script>
</head>
<body class="reader-theme-garden reader-flow-paginated">
  <a class="reader-skip-link" href="#viewerShell">Skip to book content</a>
  <div id="readerApp" class="reader-app">
    <header class="reader-topbar" aria-label="Reader controls">
      <div class="reader-left">
        <button id="tocToggle" class="reader-icon" type="button" aria-label="Table of contents" aria-controls="tocDrawer" aria-expanded="false">☰</button>
        <a id="backLink" class="reader-brand" href="/">Shadow Garden</a>
      </div>
      <div class="reader-title">
        <strong id="bookTitle">Opening EPUB…</strong>
        <span id="chapterTitle"></span>
      </div>
      <div class="reader-actions">
        <button id="bookmarkButton" class="reader-icon" type="button" title="Bookmark this location" aria-label="Bookmark this location" aria-pressed="false">◇</button>
        <button id="settingsToggle" class="reader-icon" type="button" aria-label="Reader settings" aria-controls="settingsDrawer" aria-expanded="false">Aa</button>
        <button id="focusModeButton" class="reader-icon" type="button" title="Distraction-free mode" aria-label="Enter distraction-free mode" aria-pressed="false">◐</button>
        <button id="fullscreenButton" class="reader-icon" type="button" aria-label="Fullscreen" aria-pressed="false">⛶</button>
        <a id="returnButton" class="reader-icon reader-return" href="/" title="Return to series" aria-label="Return to series">◀</a>
      </div>
    </header>

    <aside id="tocDrawer" class="reader-drawer drawer-left" aria-label="Contents and bookmarks" aria-hidden="true">
      <div class="drawer-head">
        <div class="drawer-tabs">
          <button class="active" data-panel="toc" type="button">Contents</button>
          <button data-panel="bookmarks" type="button">Bookmarks</button>
        </div>
        <button class="drawer-close" data-close="tocDrawer" type="button" aria-label="Close contents drawer">×</button>
      </div>
      <div id="tocPanel" class="drawer-panel"></div>
      <div id="bookmarksPanel" class="drawer-panel hidden"></div>
    </aside>

    <aside id="settingsDrawer" class="reader-drawer drawer-right" aria-label="Reading settings" aria-hidden="true">
      <div class="drawer-head">
        <strong>Reading settings</strong>
        <button class="drawer-close" data-close="settingsDrawer" type="button" aria-label="Close reading settings">×</button>
      </div>
      <div class="settings-panel">
        <label><span>Theme</span><select id="themeSelect"><option value="garden">Shadow Garden</option><option value="night">Night</option><option value="black">Black</option><option value="paper">Paper</option></select></label>
        <label><span>Typeface</span><select id="fontSelect"><option value="book">Book serif</option><option value="system">System sans</option><option value="classic">Classic serif</option></select></label>
        <label><span>Font size <output id="fontSizeValue">100%</output></span><input id="fontSizeRange" type="range" min="75" max="160" step="5" value="100"></label>
        <label><span>Line height <output id="lineHeightValue">1.6</output></span><input id="lineHeightRange" type="range" min="1.25" max="2.1" step="0.05" value="1.6"></label>
        <label><span>Text width <output id="widthValue">760px</output></span><input id="widthRange" type="range" min="560" max="1050" step="10" value="760"></label>
        <label><span>Reading flow</span><select id="flowSelect"><option value="paginated">Pages</option><option value="scrolled-doc">Continuous scroll</option></select></label>
        <label class="reader-toggle-setting"><span><b>Swipe page turns</b><small>Swipe left or right over the book in Pages mode.</small></span><input id="swipeTurnsToggle" type="checkbox" checked aria-label="Swipe page turns"></label>
        <label class="reader-toggle-setting"><span><b>Tap zones & focus</b><small>Tap left/right to turn pages; tap the center to hide or show reader controls.</small></span><input id="tapZonesToggle" type="checkbox" checked aria-label="Tap zones and focus mode"></label>
        <button id="resetReader" class="reader-reset" type="button">Reset reader settings</button>
      </div>
    </aside>

    <main id="viewerShell" class="viewer-shell" tabindex="-1" aria-label="EPUB reading area">
      <button id="prevPage" class="page-hit page-prev" type="button" aria-label="Previous page">◀</button>
      <div id="viewer" class="viewer"></div>
      <button id="nextPage" class="page-hit page-next" type="button" aria-label="Next page">▶</button>
      <div id="readerLoading" class="reader-loading" role="status" aria-live="polite"><span aria-hidden="true">✦</span><p>Opening the book…</p></div>
    </main>

    <footer class="reader-bottombar" aria-label="Reading navigation">
      <button id="prevBottom" type="button">◀ Previous</button>
      <div class="progress-wrap"><input id="progressRange" type="range" min="0" max="1000" value="0" aria-label="Reading progress"><span id="progressText">0%</span></div>
      <button id="nextBottom" type="button">Next ▶</button>
    </footer>

    <div id="continuousSeek" class="continuous-seek" role="slider" tabindex="0" aria-label="Reading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0%">
      <div id="continuousSeekTrack" class="continuous-seek-track" aria-hidden="true"><span id="continuousSeekThumb" class="continuous-seek-thumb"></span></div>
      <span id="continuousSeekText" class="continuous-seek-text">0%</span>
    </div>

    <section id="volumeEndPage" class="volume-end-page hidden" aria-labelledby="volumeCompleteHeading" aria-describedby="volumeCompleteDetail">
      <div class="volume-complete-card">
        <div class="volume-complete-mark" aria-hidden="true">✦</div>
        <p class="volume-complete-kicker">VOLUME COMPLETE</p>
        <h2 id="volumeCompleteHeading"><span id="volumeCompleteTitle">Volume complete</span></h2>
        <p id="volumeCompleteDetail" class="volume-complete-detail">The next path through the Garden is ready.</p>
        <div class="volume-complete-actions"><a id="nextVolumeLink" class="volume-complete-next" href="#">Read next volume ▶</a><a id="completeReturnLink" class="volume-complete-return" href="/">Return to series</a></div>
      </div>
    </section>

    <div id="drawerBackdrop" class="drawer-backdrop hidden"></div>
    <div id="toast" class="toast hidden" role="status" aria-live="polite" aria-atomic="true"></div>
  </div>
</body>
</html>
