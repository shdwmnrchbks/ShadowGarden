name: Real Browser E2E

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    # Job containers require Linux + Docker. Any Linux x64 self-hosted runner
    # can accept the job; the Playwright image is cached by Docker after its
    # first pull on each runner.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host
      # Keep npm's package cache on the runner across disposable job containers.
      # GitHub supports named Docker volumes for job containers.
      volumes:
        - shadowgarden-e2e-npm-cache:/root/.npm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install production/build dependencies
        run: npm ci --prefer-offline --no-audit --no-fund --progress=false
      - name: Install E2E dependencies
        run: npm ci --prefix tests/e2e --prefer-offline --no-audit --no-fund --progress=false
      - name: Build production output
        run: npm run build
      - name: Generate Reader EPUB fixture
        working-directory: tests/e2e
        run: node support/build-reader-fixture.mjs
      - name: Resolve real-browser projects
        id: projects
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "args=--project=chromium-desktop --project=chromium-mobile --project=webkit-mobile" >> "$GITHUB_OUTPUT"
          else
            echo "args=--project=chromium-desktop --project=firefox-desktop --project=webkit-desktop --project=chromium-mobile --project=webkit-mobile" >> "$GITHUB_OUTPUT"
          fi
      - name: Run real-browser suite
        working-directory: tests/e2e
        run: npx playwright test ${{ steps.projects.outputs.args }}
      - name: Upload Playwright failure artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shadow-garden-playwright-${{ github.run_id }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 14
