name: Baseline Health

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 1 * *' # 09:00 Asia/Manila on the first day of each month

permissions:
  contents: read

concurrency:
  group: shadow-garden-baseline-health
  cancel-in-progress: false

jobs:
  deterministic-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --progress=false
      - name: Check repository contracts
        run: npm run check
      - name: Run security contract checks
        run: npm run check:security
      - name: Run full deterministic test layers
        run: npm test
      - name: Run realistic-scale performance sanity
        run: npm run performance:sanity
      - name: Build production output
        run: npm run build
