name: Sync v2.8.0 release documentation

on:
  push:
    branches:
      - release/v2.8.0

permissions:
  contents: write

jobs:
  sync:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v2.8.0
      - name: Apply release documentation cut
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceOnce(source, before, after, label) {
            if (!source.includes(before)) throw new Error(`Missing expected ${label}`);
            return source.replace(before, after);
          }

          const changelogPath = 'CHANGELOG.md';
          let changelog = fs.readFileSync(changelogPath, 'utf8');
          if (!changelog.includes('## 2.8.0 — Reader Experience')) {
            const entry = `# Shadow Garden Changelog\n\n## 2.8.0 — Reader Experience\n- Added focused Reader typeface choices: publication-owned Default plus PT Sans, Literata, and Inter, with safe migration of legacy browser-local font preferences.\n- Unified location presentation around the canonical Page Map owner so Pages and Continuous expose device page, volume percentage, and chapter context without creating a second progress calculation.\n- Upgraded long-book navigation with in-place Contents filtering, a Current action, and bounded whole-book CFI-backed text search through the existing EPUB.js spine and Reader navigation path.\n- Added sanitized Reader-owned footnote/endnote popups for explicit EPUB noterefs without moving the live reading passage.\n- Hardened resume recovery across reloads, orientation/layout changes, backgrounding, BFCache/pageshow, and long idle periods, including exact Continuous-mode viewport restoration where layout is unchanged.\n- Expanded EPUB resilience with malformed-but-readable fixtures, stale saved-CFI fallback to first readable content, and actionable sanitized failure chrome for corrupt or unreadable packages.\n- Kept Page Map, progress, bookmarks, protected-book access, Pages/Continuous input ownership, browser-local reading data, and Continuous native touch scrolling canonical and backward-compatible.\n- Verified the completed Reader Experience milestone through the permanent Chromium, Firefox, WebKit, Chromium Mobile, and WebKit Mobile release matrix.\n\n`;
            changelog = entry + changelog.slice('# Shadow Garden Changelog\n\n'.length);
            fs.writeFileSync(changelogPath, changelog);
          }

          const roadmapPath = 'docs/roadmaps/CURRENT_ROADMAP.md';
          let roadmap = fs.readFileSync(roadmapPath, 'utf8');
          roadmap = replaceOnce(roadmap, '> **Active release:** v2.8.0 — Reader Experience  \n> **Updated:** 2026-09-02', '> **Active release:** v2.9.0 — Keeper Productivity & Recovery  \n> **Updated:** 2026-09-03', 'roadmap header');
          roadmap = replaceOnce(roadmap, 'Shadow Garden has completed its major architecture refactor, security hardening, UX polish, motion/continuity milestone, and the v2.6 real-browser reliability milestone, followed by targeted v2.6.x Reader fixes. The next substantial product milestone is Reader Experience. Performance work is intentionally limited to realistic personal-library scale and should not displace Reader work unless measurements expose a real bottleneck.', 'Shadow Garden has completed its major architecture refactor, security hardening, UX polish, motion/continuity milestone, the v2.6 real-browser reliability milestone, targeted v2.6.x Reader fixes, and the v2.8 Reader Experience milestone. The next substantial product milestone is Keeper Productivity & Recovery. Performance work remains intentionally limited to realistic personal-library scale and should not displace active operational work unless measurements expose a real bottleneck.', 'roadmap introduction');
          roadmap = replaceOnce(roadmap, '| **v2.8.0 — Reader Experience** | 🟨 In progress | Improve long-session reading ergonomics, navigation, focused typography choices, search behavior, and EPUB resilience |\n| **v2.9.0 — Keeper Productivity & Recovery** | ⬜ Planned | Make library administration faster and prove recovery from catalog/storage failures |', '| **v2.8.0 — Reader Experience** | ✅ Done | Improve long-session reading ergonomics, navigation, focused typography choices, search behavior, and EPUB resilience |\n| **v2.9.0 — Keeper Productivity & Recovery** | 🟨 In progress | Make library administration faster and prove recovery from catalog/storage failures |', 'roadmap overview');
          roadmap = replaceOnce(roadmap, '# v2.8.0 — Reader Experience\n\n**Status:** 🟨 In progress  \n**Goal:** improve the surface used for hours at a time without destabilizing the Reader architecture.', '# v2.8.0 — Reader Experience\n\n**Status:** ✅ Done  \n**Completed:** 2026-09-03  \n**Release record:** [`../releases/v2.8.0.md`](../releases/v2.8.0.md)  \n**Goal:** improve the surface used for hours at a time without destabilizing the Reader architecture.', 'v2.8 status');
          roadmap = replaceOnce(roadmap, '- [ ] Improve resume behavior after orientation changes, reloads, backgrounding, and long idle periods.\n- [ ] Expand malformed/common-EPUB compatibility fixtures and graceful error presentation.\n- [ ] Evaluate reader-history conveniences such as recently read/completion date only if they remain browser-local.', '- [x] Improve resume behavior after orientation changes, reloads, backgrounding, and long idle periods.\n- [x] Expand malformed/common-EPUB compatibility fixtures and graceful error presentation.\n- [ ] Evaluate reader-history conveniences such as recently read/completion date only if they remain browser-local. Deferred to the cross-release backlog; this is not a v2.8 release blocker.', 'v2.8 follow-up state');
          roadmap = replaceOnce(roadmap, '- [ ] Every new Reader interaction has Chromium/Firefox/WebKit coverage where technically meaningful.\n- [ ] Pages and Continuous retain their separate input ownership.\n- [ ] Page Map/progress/bookmarks remain canonical and backward-compatible.\n- [ ] No live EPUB viewport pinch/pan or Continuous touch interception is reintroduced.', '- [x] Every new Reader interaction has Chromium/Firefox/WebKit coverage where technically meaningful.\n- [x] Pages and Continuous retain their separate input ownership.\n- [x] Page Map/progress/bookmarks remain canonical and backward-compatible.\n- [x] No live EPUB viewport pinch/pan or Continuous touch interception is reintroduced.', 'v2.8 acceptance');
          roadmap = replaceOnce(roadmap, '# v2.9.0 — Keeper Productivity & Recovery\n\n**Status:** ⬜ Planned  ', '# v2.9.0 — Keeper Productivity & Recovery\n\n**Status:** 🟨 In progress  ', 'v2.9 status');
          fs.writeFileSync(roadmapPath, roadmap);

          const versioningPath = 'docs/architecture/VERSIONING_CONTRACT.md';
          let versioning = fs.readFileSync(versioningPath, 'utf8');
          versioning = replaceOnce(versioning, '**Active deployment/product version:** v2.8.0 — Reader Experience (in progress)  \n**Latest formal release:** v2.6.7', '**Active deployment/product version:** v2.8.0 — Reader Experience  \n**Formal release source version:** v2.8.0', 'versioning header');
          versioning = replaceOnce(versioning, 'During an in-progress milestone, these values may intentionally differ. For the current v2.8 work:\n\n```json\n{\n  "version": "2.6.7",\n  "deploymentVersion": "2.8.0"\n}\n```\n\nThis means the live application identifies itself as v2.8.0 while v2.6.7 remains the latest completed release record until the v2.8 milestone is formally cut.', 'During an in-progress milestone, these values may intentionally differ. At the v2.8.0 release cut they converge:\n\n```json\n{\n  "version": "2.8.0",\n  "deploymentVersion": "2.8.0"\n}\n```\n\nThe release commit therefore identifies both the formal release and the deployed product line as v2.8.0. A later milestone may advance `deploymentVersion` again while `version` remains on the latest completed formal release.', 'version owner example');
          versioning = replaceOnce(versioning, '## Cutting the final v2.8.0 release\n\nWhen v2.8.0 Reader Experience is actually complete:\n\n1. add/finalize `docs/releases/v2.8.0.md` and the v2.8 changelog entry;\n2. set `package.json#version` to `2.8.0`;\n3. regenerate `package-lock.json` with npm so its root/workspace version becomes `2.8.0` without hand-editing generated dependency metadata;\n4. keep `deploymentVersion` at `2.8.0` or remove it once the fallback produces the same value;\n5. run the permanent Verify and Real Browser E2E gates;\n6. let the existing release publisher verify production and create the GitHub release.\n\nNever hand-edit dependency integrity or transitive dependency fields in `package-lock.json` merely to synchronize a version label.', '## v2.8.0 release state\n\nThe v2.8.0 release commit aligns `package.json#version`, `package-lock.json`, and `deploymentVersion` at `2.8.0`, includes `docs/releases/v2.8.0.md` plus the matching changelog entry, and records the completed Reader Experience acceptance criteria. The permanent Verify and Real Browser E2E gates remain authoritative. After merge, the existing publisher must still match the exact production deployment version/commit and pass public production smoke checks before creating the GitHub release.\n\nFuture development may advance `deploymentVersion` for the next active milestone while `version` remains on the latest completed formal release. Never hand-edit dependency integrity or transitive dependency fields in `package-lock.json` merely to synchronize a version label.', 'v2.8 release instructions');
          fs.writeFileSync(versioningPath, versioning);

          const notes = `# Shadow Garden v2.8.0 — Reader Experience\n\nShadow Garden v2.8.0 completes the Reader Experience milestone. It improves the reading surface used for long sessions while preserving the architecture and persistence contracts established by the v2 reliability work: Page Map, progress, bookmarks, protected-book access, and Pages/Continuous input ownership remain canonical.\n\n## Focused typography and clearer progress\n\nReader typography now offers four intentional choices: publication-owned **Default**, **Sans** with PT Sans, **Serif** with Literata, and **Sans-Serif** with Inter. Legacy browser-local font preferences migrate safely without changing font size, line height, text width, flow, or other Reader settings.\n\nPages mode now presents canonical device page, volume percentage, and chapter context together. Continuous mirrors the same owner through its seek rail and accessibility text rather than introducing a second progress calculation.\n\n## Long-book navigation and search\n\nThe Contents drawer can filter in place while preserving its collapse state. A **Current** action clears filtering, reveals the live chapter, and restores focus without moving the rendition.\n\nThe same Contents surface now owns whole-book text search. Ctrl/Cmd+F opens that unified search, Contents matches remain first, and book text is scanned sequentially through the canonical EPUB.js spine. Results are CFI-backed and open through the existing Reader navigation path. Searches require three characters, are cancellable, unload scanned sections, and stop at 100 results.\n\n## Footnotes and resume recovery\n\nExplicit EPUB noterefs now open sanitized Reader-owned footnote/endnote popups without moving the live passage, including same-document footnotes and cross-document endnotes.\n\nResume handling is hardened across reloads, orientation and viewport changes, backgrounding, BFCache/pageshow, and long idle periods. Protected access renewal is serialized before touching a long-suspended rendition. Layout-changing recovery prefers the semantic reading CFI, while unchanged-layout Continuous recovery preserves the same semantic content block at the same viewport-relative position when possible.\n\n## EPUB compatibility and graceful failure\n\nThe Reader now has deterministic fixtures for a common imperfect EPUB that omits title/navigation conveniences and for an intentionally corrupt package. A stale saved CFI gets one bounded fallback to first readable content; genuine first-content failures are never masked.\n\nUnrecoverable startup failures stay inside Reader-owned chrome with sanitized, actionable guidance, **Try again**, and a return action. Raw parser messages are not exposed to readers. Definitive invalid ZIP/package failures discovered by visual-page preflight are promoted to the same graceful startup surface instead of leaving the Reader indefinitely preparing the book.\n\n## Reliability contract\n\nThe completed milestone is covered by the permanent real-browser matrix across Chromium desktop, Firefox desktop, WebKit desktop, Chromium Mobile, and WebKit Mobile where technically meaningful. Pages and Continuous retain separate input ownership, Page Map/progress/bookmarks remain browser-local and backward-compatible, and no live EPUB pinch/pan owner or Continuous touch interception is reintroduced.\n\nThe reusable v2 publisher still requires the exact release commit to pass Verify and Real Browser E2E, match Cloudflare production version/commit metadata, and pass public production smoke before the GitHub release is created.\n`;
          fs.writeFileSync('docs/releases/v2.8.0.md', notes);
          NODE
      - name: Commit release documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md docs/roadmaps/CURRENT_ROADMAP.md docs/architecture/VERSIONING_CONTRACT.md docs/releases/v2.8.0.md
          git diff --cached --quiet && exit 0
          git commit -m "docs: finalize v2.8.0 release record"
          git push origin HEAD:release/v2.8.0
