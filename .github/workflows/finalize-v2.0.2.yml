name: Finalize v2.0.2 metadata

on:
  push:
    branches:
      - fix-mobile-filter-pills-v2.0.2
    paths:
      - .github/workflows/finalize-v2.0.2.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix-mobile-filter-pills-v2.0.2
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Reconcile v2.0.2 metadata
        shell: bash
        run: |
          npm version 2.0.2 --no-git-tag-version
          node <<'NODE'
          const fs=require('node:fs');
          const path='CHANGELOG.md';
          let text=fs.readFileSync(path,'utf8');
          const heading='## 2.0.2 — Mobile Filter Layout Hotfix';
          if(!text.includes(heading)){
            const entry=`${heading}\n- Fixed narrow-screen active filter pills so Search, Author, Year, Volume, Reading state, Pinned-only, and tags wrap inside the mobile viewport instead of clipping in a horizontal rail.\n- Added the active search query as the first removable filter pill and kept long pill labels ellipsized.\n- Removed reserved mobile spacing when New Growth / Recently Added is hidden for active search/filter results while preserving its fade/collapse motion.\n\n`;
            text=text.replace('# Shadow Garden Changelog\n\n',`# Shadow Garden Changelog\n\n${entry}`);
            fs.writeFileSync(path,text);
          }
          NODE
          rm .github/workflows/finalize-v2.0.2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finalize v2.0.2 metadata'
          git push origin HEAD:fix-mobile-filter-pills-v2.0.2
