name: Apply mobile filter first paint

on:
  push:
    branches:
      - fix-mobile-filter-first-paint-v2.2.1

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix-mobile-filter-first-paint-v2.2.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Apply first-paint changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing expected text in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, count))

          # Main + Adult HTML: mobile starts visually collapsed before deferred JS runs.
          for path in ["src/index.html", "src/nsfw.html"]:
              replace(path, '<aside class="filters"', '<aside class="filters filters-mobile-initial-collapsed"')
              replace(path, 'class="filter-toggle mobile-filter-toggle" type="button" hidden aria-expanded="true"', 'class="filter-toggle mobile-filter-toggle" type="button" aria-expanded="false"')

          # CSS: the initial marker only collapses under the mobile breakpoint; desktop remains expanded.
          css_path = Path("src/assets/css/library-features.css")
          css = css_path.read_text()
          marker = '.filter-toggle{flex:0 0 30px;width:30px;height:30px;display:grid;place-items:center;border:0;border-left:1px solid var(--line);color:var(--dim);background:transparent;cursor:pointer;font-size:.9rem}.filter-toggle:hover,.filter-toggle:focus-visible{color:var(--leaf2);outline:none}'
          replacement = marker + '\n@media(min-width:721px){.mobile-filter-toggle{display:none!important}}'
          if marker not in css:
              raise SystemExit('filter toggle CSS marker missing')
          css = css.replace(marker, replacement, 1)
          mobile_marker = '@media(max-width:720px){\n  .catalog-layout{row-gap:14px}'
          mobile_replacement = '@media(max-width:720px){\n  .filters.filters-mobile-initial-collapsed>.filter-head,.filters.filters-mobile-initial-collapsed>.filter-group,.filters.filters-mobile-initial-collapsed .search-hint{display:none!important}\n  .filters.filters-mobile-initial-collapsed{display:block;gap:0}\n  .filters.filters-mobile-initial-collapsed .search-stack{display:block}\n  .filters.filters-mobile-initial-collapsed .search-field{width:100%}\n  .catalog-layout{row-gap:14px}'
          if mobile_marker not in css:
              raise SystemExit('mobile CSS marker missing')
          css_path.write_text(css.replace(mobile_marker, mobile_replacement, 1))

          # JS: immediately hand the first-paint marker to the canonical runtime collapsed class before async import.
          js_path = Path("src/assets/js/library-mobile-filter.js")
          js = js_path.read_text()
          old = "  if(!panel||!toggle||!head||!clear||!searchField||!searchStack)return;\n\n  const {preferences}=await import('/assets/js/domain/index.js');\n  const scope=document.body.dataset.libraryScope||'main';\n  const mobileQuery=window.matchMedia('(max-width: 720px)');"
          new = "  if(!panel||!toggle||!head||!clear||!searchField||!searchStack)return;\n\n  const mobileQuery=window.matchMedia('(max-width: 720px)');\n  if(mobileQuery.matches){\n    panel.classList.add('filters-collapsed');\n    toggle.hidden=false;\n    toggle.setAttribute('aria-expanded','false');\n  }\n  panel.classList.remove('filters-mobile-initial-collapsed');\n\n  const {preferences}=await import('/assets/js/domain/index.js');\n  const scope=document.body.dataset.libraryScope||'main';"
          if old not in js:
              raise SystemExit('mobile controller marker missing')
          js_path.write_text(js.replace(old, new, 1))

          # Regression coverage: first paint must be collapsed without waiting for JS/catalog data.
          test_path = Path("tests/browser/library-filter-ux.test.mjs")
          test = test_path.read_text()
          anchor = 'test("long search text cannot widen the Search Filter panel, Search field, or selectors",async()=>{'
          added = r'''test("mobile Search Filter is collapsed on first paint before deferred Library initialization",async()=>{
  const [mobile,css,mainHtml,adultHtml]=await Promise.all([
    read("src/assets/js/library-mobile-filter.js"),
    read("src/assets/css/library-features.css"),
    read("src/index.html"),
    read("src/nsfw.html")
  ]);

  for(const html of [mainHtml,adultHtml]){
    assert.match(html,/class="filters filters-mobile-initial-collapsed"/);
    assert.match(html,/id="filterToggle"[^>]*aria-expanded="false"/);
    assert.equal(/id="filterToggle"[^>]*\shidden(?:\s|>)/.test(html),false,"mobile toggle must not wait on JavaScript to become visible");
  }
  assert.match(css,/@media\(min-width:721px\)\{\.mobile-filter-toggle\{display:none!important\}\}/);
  assert.match(css,/@media\(max-width:720px\)\{[\s\S]*?\.filters\.filters-mobile-initial-collapsed>\.filter-head,[^\n]*display:none!important/);
  assert.match(css,/\.filters\.filters-mobile-initial-collapsed\{display:block;gap:0\}/);
  const handoff="panel.classList.remove('filters-mobile-initial-collapsed')";
  const domainImport="await import('/assets/js/domain/index.js')";
  assert.ok(mobile.indexOf(handoff)>=0&&mobile.indexOf(handoff)<mobile.indexOf(domainImport),"first-paint marker must hand off before the async domain import");
  assert.match(mobile,/if\(mobileQuery\.matches\)\{[\s\S]*?panel\.classList\.add\('filters-collapsed'\)/);
});

'''
          if anchor not in test:
              raise SystemExit('browser test anchor missing')
          test_path.write_text(test.replace(anchor, added + anchor, 1))

          # Release metadata.
          pkg_path = Path("package.json")
          pkg = json.loads(pkg_path.read_text())
          pkg["version"] = "2.2.1"
          pkg_path.write_text(json.dumps(pkg, indent=2) + "\n")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text()
          heading = '# Shadow Garden Changelog\n\n'
          entry = '''## 2.2.1 — Mobile Filter First Paint\n- Main and Adult Library Search/Filter panels now render collapsed from the initial mobile HTML/CSS state instead of expanding until JavaScript and catalog initialization finish.\n- Desktop first paint remains expanded, while the mobile filter toggle is available immediately and hands off to the canonical R2 runtime/persistence owner.\n- Added browser regression coverage for the no-flash mobile loading state.\n\n'''
          if not changelog.startswith(heading):
              raise SystemExit('changelog heading missing')
          changelog_path.write_text(heading + entry + changelog[len(heading):])
          PY

          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --progress=false

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-mobile-filter-first-paint.yml
          git add src/index.html src/nsfw.html src/assets/css/library-features.css src/assets/js/library-mobile-filter.js tests/browser/library-filter-ux.test.mjs package.json package-lock.json CHANGELOG.md
          git commit -m "Fix mobile Library filter first paint"
          git push origin HEAD:fix-mobile-filter-first-paint-v2.2.1
