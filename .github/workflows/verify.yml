name: Verify Shadow Garden

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --progress=false
      - name: Check repository
        run: npm run check
      - name: Run Functions security contracts
        run: npm run check:security
      - name: Run Functions service regressions
        run: npm run test:service
      - name: Run Reader lifecycle unit tests
        run: node --test tests/unit/reader-continuous.test.mjs tests/unit/reader-rendition.test.mjs tests/unit/reader-resume.test.mjs tests/unit/reader-resume-lifecycle.test.mjs tests/unit/reader-epub-lifecycle.test.mjs
      - name: Run Library audit unit tests
        run: node --test tests/unit/data-source-catalog-sharing.test.mjs tests/unit/library-contextual-filters.test.mjs tests/unit/library-reading-performance.test.mjs
      - name: Build production output
        run: npm run build
