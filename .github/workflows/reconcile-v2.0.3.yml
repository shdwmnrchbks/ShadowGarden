name: Reconcile v2.0.3 metadata

on:
  push:
    branches:
      - fix-series-adult-first-paint-v2.0.3
    paths:
      - .github/workflows/reconcile-v2.0.3.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix-series-adult-first-paint-v2.0.3
      - name: Finalize v2.0.3 metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const version='2.0.3';
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          pkg.version=version;
          fs.writeFileSync('package.json',JSON.stringify(pkg,null,2)+'\n');

          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          lock.version=version;
          if(lock.packages?.[''])lock.packages[''].version=version;
          fs.writeFileSync('package-lock.json',JSON.stringify(lock,null,2)+'\n');

          const changelogPath='CHANGELOG.md';
          let changelog=fs.readFileSync(changelogPath,'utf8');
          const marker='# Shadow Garden Changelog\n';
          const entry='\n## 2.0.3 — Adult Series First-Paint Hotfix\n- Applied Adult Series route scope before the visible Series shell is parsed, eliminating the brief Main-theme loading frame.\n- Made the initial Series back control scope-aware so Adult routes show “Back to Adult Library” from first paint instead of repainting after catalog startup.\n- Kept loaded `series.nsfw` metadata authoritative for the final scope and preserved the frozen R10 external entrypoint baseline.\n';
          if(!changelog.includes('## 2.0.3 — Adult Series First-Paint Hotfix')){
            if(!changelog.startsWith(marker))throw new Error('Unexpected changelog heading');
            changelog=marker+entry+changelog.slice(marker.length);
            fs.writeFileSync(changelogPath,changelog);
          }
          NODE
          git rm .github/workflows/reconcile-v2.0.3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json CHANGELOG.md
          git commit -m 'Finalize v2.0.3 metadata'
          git push origin HEAD:fix-series-adult-first-paint-v2.0.3
