name: Temporary v2.11 WebKit Continuous sync patch

on:
  push:
    branches:
      - fix/v2.11-webkit-continuous-chapter-sync
    paths:
      - .github/workflows/temp-v2-11-webkit-continuous-sync.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v2.11-webkit-continuous-chapter-sync
          fetch-depth: 0

      - name: Apply bounded runtime fix
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          function replaceExact(path, before, after) {
            const source = fs.readFileSync(path, 'utf8');
            if (!source.includes(before)) throw new Error(`Expected patch anchor missing in ${path}`);
            const next = source.replace(before, after);
            if (next === source) throw new Error(`Patch did not change ${path}`);
            fs.writeFileSync(path, next);
          }

          replaceExact(
            'src/assets/js/reader/app.js',
            `  async function navigate(target){\n    if(!target)return;\n    await resumeController?.wait?.();\n    if(!state.rendition)return;\n    resetReaderInput();\n    if(settingsController.get().flow==="scrolled-doc")await continuousController.display(target);\n    else await state.rendition.display(target);\n  }`,
            `  async function navigate(target){\n    if(!target)return;\n    await resumeController?.wait?.();\n    if(!state.rendition)return;\n    resetReaderInput();\n    if(settingsController.get().flow==="scrolled-doc"){\n      await continuousController.display(target);\n      /* EPUB.js can leave Continuous location reporting on the preceding buffered section in\n         WebKit even after an explicit href is visibly displayed. Once the display and final\n         reportLocation settle, the requested TOC href owns chapter chrome until the next real\n         relocation. CFI/search targets still rely on canonical relocated events. */\n      const requested={start:{href:String(target)}};\n      const chapter=tocController?.chapterForLocation?.(requested)||"";\n      if(chapter){state.currentChapter=chapter;if(elements.chapterTitle)elements.chapterTitle.textContent=chapter;tocController?.setActiveForLocation?.(requested)}\n    }else await state.rendition.display(target);\n  }`
          );

          replaceExact(
            'src/assets/js/reader/continuous.js',
            `        await nextPaint();\n        if(rendition===getRendition?.())rendition.reportLocation?.();`,
            `        await nextPaint();\n        if(rendition===getRendition?.())await rendition.reportLocation?.();`
          );
          NODE

      - name: Guard diff and commit
        shell: bash
        run: |
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' src/assets/js/reader/app.js src/assets/js/reader/continuous.js | sort)"
          test "$actual" = "$expected"
          git config user.name 'shadowgarden-release-bot'
          git config user.email 'shadowgarden-release-bot@users.noreply.github.com'
          git add src/assets/js/reader/app.js src/assets/js/reader/continuous.js
          git commit -m 'fix(v2.11): synchronize Continuous TOC chapter chrome'
          git push origin HEAD:fix/v2.11-webkit-continuous-chapter-sync
