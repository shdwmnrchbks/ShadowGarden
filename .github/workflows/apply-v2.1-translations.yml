name: Apply v2.1 translation implementation

on:
  push:
    branches:
      - feature-fan-translation-metadata-v2.1.0
    paths:
      - tools/apply-v2.1-translations.mjs
      - .github/workflows/apply-v2.1-translations.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature-fan-translation-metadata-v2.1.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Apply translation provenance feature
        run: node tools/apply-v2.1-translations.mjs
      - name: Remove one-shot implementation helpers
        run: rm -f tools/apply-v2.1-translations.mjs .github/workflows/apply-v2.1-translations.yml
      - name: Commit feature implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement fan translation provenance"
          git push origin HEAD:feature-fan-translation-metadata-v2.1.0
