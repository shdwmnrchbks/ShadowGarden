name: Reconcile v2.2 R3 guard

on:
  push:
    paths:
      - ".github/workflows/reconcile-v2.2-r3-guard.yml"

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature-read-suggestions-random-banners-v2.2.0
      - name: Follow the v2.2 R2 banner owner from R3
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/check-r3.mjs')
          text=p.read_text()
          old='for(const marker of ["library-model.js","library-renderers.js","public/volume-actions.js","pageshow","preserveCount:true","preferences.libraryView","readingStatus.latestActiveEntry"]){if(!library.includes(marker))fail(`Library controller is missing ${marker}`)}'
          new='for(const marker of ["library-model.js","library-renderers.js","public/volume-actions.js","pageshow","preserveCount:true","preferences.libraryView","readingStatus.libraryBannerEntry"]){if(!library.includes(marker))fail(`Library controller is missing ${marker}`)}'
          if old not in text:
              raise SystemExit('R3 Library controller marker not found')
          if text.count(old)!=1:
              raise SystemExit('R3 Library controller marker is not unique')
          p.write_text(text.replace(old,new,1))
          PY
          if grep -R -n 'readingStatus\.latestActiveEntry' tools; then
            echo 'A direct Library latestActiveEntry guard still remains under tools/' >&2
            exit 1
          fi
          rm .github/workflows/reconcile-v2.2-r3-guard.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/check-r3.mjs .github/workflows/reconcile-v2.2-r3-guard.yml
          git commit -m "Reconcile R3 with v2.2 Library banner owner"
          git push origin HEAD:feature-read-suggestions-random-banners-v2.2.0
