name: Finalize v2.1.1 translation cleanup

on:
  push:
    branches:
      - fix-translation-metadata-v2.1.1
    paths:
      - .github/workflows/finalize-v2.1.1.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix-translation-metadata-v2.1.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Reconcile labels and changelog
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs/promises';
          const libraryPath='src/assets/js/library.js';
          const library=await fs.readFile(libraryPath,'utf8');
          if(!library.includes('Fan translator / group')) throw new Error('Translator filter label marker missing');
          await fs.writeFile(libraryPath,library.replace('Fan translator / group','Fan translator'));

          const changelogPath='CHANGELOG.md';
          const changelog=await fs.readFile(changelogPath,'utf8');
          const marker='# Shadow Garden Changelog\n';
          if(!changelog.startsWith(marker)) throw new Error('Changelog header missing');
          const entry=`\n## 2.1.1 — Translation Metadata Cleanup\n- Removed the duplicate Series Translation Credits panel; the compact Series information attribution is now the sole series-level translation credit presentation.\n- Translator names now open their configured source URL when available and fall back to the Library translator filter when no source URL is stored.\n- Matched Series Status and Translation Status dropdown presentation to the styled Series Banner selector.\n- Added EPUB contributor-role scanning so EPUB3 refined MARC relator \`trl\` metadata and legacy \`opf:role=\"trl\"\` metadata prefill the upload translator credit.\n- Retired Translation Group and Attribution Note from browser/server normalization, Keeper editing, upload fields, search terms, and public catalog output.\n- Fixed Translator filter initialization so selecting a translator produces the expected removable active-filter pill and applies the filter.\n`;
          await fs.writeFile(changelogPath,marker+entry+changelog.slice(marker.length));
          NODE
      - name: Bump version metadata
        run: npm version 2.1.1 --no-git-tag-version
      - name: Remove one-shot workflow
        run: rm .github/workflows/finalize-v2.1.1.yml
      - name: Commit release metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize v2.1.1 translation cleanup"
          git push origin HEAD:fix-translation-metadata-v2.1.1
