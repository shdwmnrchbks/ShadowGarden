name: Retry v2.4 Library UX

on:
  push:
    branches:
      - ux-v2.4-library-discovery
    paths:
      - .github/workflows/apply-v24-library-retry.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ux-v2.4-library-discovery
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Apply Library UX patch
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/nsfw.html')
          text=p.read_text()
          p.write_text(text.replace('<h2>The Night Garden is quiet.</h2>','<h2>The Garden is quiet.</h2>',1))
          PY
          python3 tools/tmp-v24-library.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/nsfw.html')
          text=p.read_text()
          p.write_text(text.replace('<h2>The Garden is quiet.</h2>','<h2>The Night Garden is quiet.</h2>',1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/tmp-v24-library.py .github/workflows/apply-v24-library.yml .github/workflows/apply-v24-library-retry.yml
          git add src tests tools docs functions package.json package-lock.json CHANGELOG.md || true
          git commit -m "Polish Library search and discovery UX"
          git push origin HEAD:ux-v2.4-library-discovery
