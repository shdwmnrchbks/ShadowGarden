name: Apply v2.1.2 Library UX

on:
  push:
    branches: [fix-library-result-focus-v2.1.2]
    paths:
      - ".github/workflows/apply-v2.1.2-library-ux.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix-library-result-focus-v2.1.2
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Apply controller and release metadata
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path=Path('src/assets/js/library.js')
          text=path.read_text()
          text=text.replace('  const mobileFilterQuery=window.matchMedia("(max-width: 720px)");\n','')
          old='''  function syncMobileResultFocus(){\n    $("#recentSection")?.classList.toggle("mobile-results-focus",mobileFilterQuery.matches&&hasActiveResultFilter());\n  }'''
          new='''  function syncResultFocus(){\n    $("#recentSection")?.classList.toggle("results-focus",hasActiveResultFilter());\n  }'''
          if old not in text:
              raise SystemExit('syncMobileResultFocus block not found')
          text=text.replace(old,new)
          text=text.replace('syncMobileResultFocus()','syncResultFocus()')
          text='\n'.join(line for line in text.splitlines() if 'mobileFilterQuery' not in line)+'\n'
          if 'mobile-results-focus' in text or 'syncMobileResultFocus' in text:
              raise SystemExit('old mobile-only result-focus ownership remains')
          path.write_text(text)

          changelog=Path('CHANGELOG.md')
          body=changelog.read_text()
          marker='# Shadow Garden Changelog\n\n'
          entry='''## 2.1.2 — Library Result Focus & Card Spacing\n- Extended the New Growth / Recently Added fade-and-collapse behavior to desktop whenever search text or a result filter is active, so filtered catalog results move into view immediately on every viewport.\n- Relocated active Search/Filter pills directly below the search bar and before Author in both Main and Adult libraries, while preserving the collapsed mobile presentation.\n- Rebalanced Library card translator attribution to the same muted visual hierarchy as the author instead of accenting it more strongly.\n- Removed the reserved second title line from non-compact desktop grid cards so one-line series titles no longer leave a large gap before author metadata.\n- Expanded browser regression coverage for cross-viewport result focus, pill placement, translator hierarchy, and desktop grid spacing.\n\n'''
          if marker not in body:
              raise SystemExit('changelog marker not found')
          changelog.write_text(body.replace(marker,marker+entry,1))
          PY
          npm version 2.1.2 --no-git-tag-version
          rm .github/workflows/apply-v2.1.2-library-ux.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/js/library.js package.json package-lock.json CHANGELOG.md .github/workflows/apply-v2.1.2-library-ux.yml
          git commit -m "Finalize v2.1.2 Library result focus cleanup"
          git push origin HEAD:fix-library-result-focus-v2.1.2
