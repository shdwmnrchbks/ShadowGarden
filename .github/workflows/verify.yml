name: Verify Shadow Garden

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-runner:
    name: Select runner
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.select.outputs.runner }}
      kind: ${{ steps.select.outputs.kind }}
    steps:
      - name: Prefer online self-hosted x64 runner
        id: select
        shell: bash
        env:
          ROUTER_TOKEN: ${{ secrets.RUNNER_ROUTER_TOKEN }}
          ORG: ${{ github.repository_owner }}
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name || '' }}
        run: |
          set -euo pipefail

          use_hosted() {
            echo 'runner="ubuntu-latest"' >> "$GITHUB_OUTPUT"
            echo 'kind=github-hosted' >> "$GITHUB_OUTPUT"
          }

          # Never execute code from an external fork on a self-hosted machine.
          if [[ "$EVENT_NAME" == "pull_request" && "$PR_HEAD_REPO" != "$GITHUB_REPOSITORY" ]]; then
            echo "External pull request: using GitHub-hosted runner."
            use_hosted
            exit 0
          fi

          if [[ -z "${ROUTER_TOKEN:-}" ]]; then
            echo "::warning::RUNNER_ROUTER_TOKEN is unavailable; using GitHub-hosted fallback."
            use_hosted
            exit 0
          fi

          if ! runners="$(curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $ROUTER_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/orgs/$ORG/actions/runners?per_page=100")"; then
            echo "::warning::Could not query organization runners; using GitHub-hosted fallback."
            use_hosted
            exit 0
          fi

          if jq -e '[.runners[] | select(.status == "online") | [.labels[].name] | select(index("self-hosted") != null and index("X64") != null)] | length > 0' >/dev/null <<<"$runners"; then
            echo 'runner=["self-hosted","X64"]' >> "$GITHUB_OUTPUT"
            echo 'kind=self-hosted' >> "$GITHUB_OUTPUT"
            echo "Using an online self-hosted x64 runner."
          else
            echo "No compatible self-hosted x64 runner is online; using GitHub-hosted fallback."
            use_hosted
          fi

  check:
    name: Check
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.runner) }}
    timeout-minutes: 10
    steps:
      - name: Report runner selection
        run: echo "Runner route: ${{ needs.select-runner.outputs.kind }}"
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund --progress=false
      - name: Check repository
        run: npm run check
      - name: Build production output
        run: npm run build
