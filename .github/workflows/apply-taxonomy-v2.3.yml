name: Apply v2.3 catalog taxonomy

on:
  push:
    branches:
      - feature-catalog-taxonomy-v2.3.0
    paths:
      - tools/tmp-apply-taxonomy-v23.py
      - .github/workflows/apply-taxonomy-v2.3.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature-catalog-taxonomy-v2.3.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Apply taxonomy integration
        run: |
          python3 tools/tmp-apply-taxonomy-v23.py
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --progress=false
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/tmp-apply-taxonomy-v23.py .github/workflows/apply-taxonomy-v2.3.yml
          git add src functions tests docs package.json package-lock.json CHANGELOG.md
          git commit -m "Integrate canonical catalog taxonomy"
          git push origin HEAD:feature-catalog-taxonomy-v2.3.0
