<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lost in the Garden — Shadow Garden</title>
  <link rel="stylesheet" href="/assets/css/styles.css">
  <style>
    .lost {
      min-height: 100vh;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
    }
    .lost-card {
      max-width: 560px;
      padding: 48px 30px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
    }
    .lost h1 {
      margin: 0 0 14px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.8rem, 8vw, 5rem);
      font-weight: 500;
    }
    .lost p { color: var(--muted); }
  </style>
</head>
<body>
  <main class="lost">
    <section class="lost-card">
      <p class="eyebrow">404 — LOST PATH</p>
      <h1>The garden ends here.</h1>
      <p>The page you followed does not exist.</p>
      <p><a class="button button-primary" href="/">Return to Shadow Garden</a></p>
    </section>
  </main>
</body>
</html>
