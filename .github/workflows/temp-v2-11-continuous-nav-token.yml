name: Temporary v2.11 Continuous navigation ownership patch

on:
  push:
    branches:
      - fix/v2.11-webkit-continuous-chapter-sync
    paths:
      - .github/workflows/temp-v2-11-continuous-nav-token.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fix branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/v2.11-webkit-continuous-chapter-sync
          fetch-depth: 0

      - name: Apply direction-aware navigation ownership
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/assets/js/reader/app.js')
          source = path.read_text()

          old_state = '  const state={book:null,rendition:null,navigation:null,pageMap:null,currentChapter:"",renditionSerial:0,switchingFlow:false,queuedFlow:null,renderedFlow:null,toastTimer:0,resizeTimer:0,relayoutTimer:0,pageMapRefreshTimer:0};'
          new_state = '  const state={book:null,rendition:null,navigation:null,pageMap:null,currentChapter:"",currentSpineIndex:null,continuousNavigation:null,renditionSerial:0,switchingFlow:false,queuedFlow:null,renderedFlow:null,toastTimer:0,resizeTimer:0,relayoutTimer:0,pageMapRefreshTimer:0};'
          if old_state not in source:
              raise RuntimeError('State anchor missing')
          source = source.replace(old_state, new_state, 1)

          nav = (
              '  function resetReaderInput(){pageInputController?.reset();imageFocusController?.closeImageFocus({restoreFocus:false})}\n'
              '  function targetSpineIndex(target){\n'
              '    const text=String(target||"");if(!text||text.startsWith("epubcfi("))return null;\n'
              '    for(const value of [text,text.split("#")[0]]){try{const index=Number(state.book?.spine?.get?.(value)?.index);if(Number.isFinite(index))return index}catch{}}\n'
              '    return null;\n'
              '  }\n'
              '  function locationSpineIndex(location){\n'
              '    for(const value of [location?.start?.index,location?.end?.index]){const index=Number(value);if(Number.isFinite(index)&&index>=0)return index}\n'
              '    return targetSpineIndex(location?.start?.href||location?.end?.href||"");\n'
              '  }\n'
              '  function relocationIsBeforeExplicitTarget(location,intent){\n'
              '    const index=locationSpineIndex(location);if(!Number.isFinite(index)||!Number.isFinite(intent?.targetIndex)||!Number.isFinite(intent?.fromIndex))return false;\n'
              '    if(intent.targetIndex>intent.fromIndex)return index<intent.targetIndex;\n'
              '    if(intent.targetIndex<intent.fromIndex)return index>intent.targetIndex;\n'
              '    return false;\n'
              '  }\n\n'
              '  async function navigate(target){\n'
              '    if(!target)return;\n'
              '    await resumeController?.wait?.();\n'
              '    if(!state.rendition)return;\n'
              '    resetReaderInput();\n'
              '    if(settingsController.get().flow==="scrolled-doc"){\n'
              '      const requested={start:{href:String(target)}};\n'
              '      const chapter=tocController?.chapterForLocation?.(requested)||"";\n'
              '      const targetIndex=targetSpineIndex(target);\n'
              '      const intent=chapter&&Number.isFinite(targetIndex)?{rendition:state.rendition,requested,chapter,targetIndex,fromIndex:state.currentSpineIndex}:null;\n'
              '      state.continuousNavigation=intent;\n'
              '      try{\n'
              '        await continuousController.display(target);\n'
              '        /* Explicit href navigation owns semantic chapter chrome while EPUB.js settles its\n'
              '           Continuous buffer. Late relocations from the old side of the target are ignored\n'
              '           until location reporting reaches the requested spine section. */\n'
              '        if(intent&&state.continuousNavigation===intent){state.currentChapter=chapter;if(elements.chapterTitle)elements.chapterTitle.textContent=chapter;tocController?.setActiveForLocation?.(requested)}\n'
              '      }catch(error){if(state.continuousNavigation===intent)state.continuousNavigation=null;throw error}\n'
              '    }else{state.continuousNavigation=null;await state.rendition.display(target)}\n'
              '  }\n\n'
              '  const bookSearchController'
          )
          source, nav_count = re.subn(
              r'  function resetReaderInput\(\).*?\n\n  const bookSearchController',
              lambda _: nav,
              source,
              count=1,
              flags=re.S,
          )
          if nav_count != 1:
              raise RuntimeError(f'Navigate boundary replacement count: {nav_count}')

          relocated = (
              '  function onRelocated(rendition,location){\n'
              '    if(rendition!==state.rendition)return;\n'
              '    const intent=state.continuousNavigation;\n'
              '    if(intent?.rendition===rendition&&relocationIsBeforeExplicitTarget(location,intent)){themeController.refresh(rendition);return}\n'
              '    const spineIndex=locationSpineIndex(location);if(Number.isFinite(spineIndex))state.currentSpineIndex=spineIndex;\n'
              '    const chapter=tocController.chapterForLocation(location);\n'
              '    if(intent?.rendition===rendition){\n'
              '      const reachedChapter=Boolean(intent.chapter&&chapter===intent.chapter);\n'
              '      const reachedIndex=Number.isFinite(spineIndex)&&Number.isFinite(intent.targetIndex)&&(!Number.isFinite(intent.fromIndex)||intent.targetIndex>=intent.fromIndex?spineIndex>=intent.targetIndex:spineIndex<=intent.targetIndex);\n'
              '      if(reachedChapter||reachedIndex)state.continuousNavigation=null;\n'
              '    }\n'
              '    state.currentChapter=chapter;if(elements.chapterTitle)elements.chapterTitle.textContent=state.currentChapter;\n'
              '    progressController.save(location);resumeController?.remember();tocController.setActiveForLocation(location);bookmarksController.syncButton();themeController.refresh(rendition);\n'
              '  }\n'
              '  function wireRendition'
          )
          source, relocated_count = re.subn(
              r'  function onRelocated\(rendition,location\)\{.*?\n  \}\n  function wireRendition',
              lambda _: relocated,
              source,
              count=1,
              flags=re.S,
          )
          if relocated_count != 1:
              raise RuntimeError(f'Relocated boundary replacement count: {relocated_count}')

          path.write_text(source)
          PY

      - name: Guard final branch diff and commit
        shell: bash
        run: |
          git rm .github/workflows/temp-v2-11-continuous-nav-token.yml
          git diff --check HEAD
          actual="$(git diff HEAD --name-only | sort)"
          expected="$(printf '%s\n' .github/workflows/temp-v2-11-continuous-nav-token.yml src/assets/js/reader/app.js | sort)"
          test "$actual" = "$expected"
          git config user.name 'shadowgarden-release-bot'
          git config user.email 'shadowgarden-release-bot@users.noreply.github.com'
          git add -A
          git commit -m 'fix(v2.11): guard explicit Continuous navigation ownership'
          git push origin HEAD:fix/v2.11-webkit-continuous-chapter-sync
