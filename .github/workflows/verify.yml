name: Verify Shadow Garden

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Apply one-shot R10 v2 cutover
        if: ${{ hashFiles('tools/r10-cutover.mjs') != '' }}
        run: |
          node tools/r10-cutover.mjs
          rm tools/r10-cutover.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "R10: apply final v2 source cutover"
          git push origin HEAD:${GITHUB_HEAD_REF}
      - name: Install dependencies
        run: npm ci --no-audit --no-fund --progress=false
      - name: Check repository
        run: npm run check
      - name: Build production output
        run: npm run build
