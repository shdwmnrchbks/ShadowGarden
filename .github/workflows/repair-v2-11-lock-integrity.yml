name: Repair v2.11 lock integrity

on:
  push:
    branches:
      - release/v2.11.0-convergence

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6.0.2
        with:
          ref: release/v2.11.0-convergence
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6.0.0
        with:
          node-version: 22.23.2

      - name: Regenerate only the stale es6-iterator lock entry
        shell: bash
        run: |
          set -euo pipefail
          cp package-lock.json /tmp/package-lock.before.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const path = 'package-lock.json';
          const lock = JSON.parse(fs.readFileSync(path, 'utf8'));
          delete lock.packages['node_modules/es6-iterator'];
          fs.writeFileSync(path, `${JSON.stringify(lock, null, 2)}\n`);
          NODE
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --progress=false

      - name: Assert npm changed only the published integrity
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const before = JSON.parse(fs.readFileSync('/tmp/package-lock.before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const key = 'node_modules/es6-iterator';
          const expected = 'sha512-zw4SRzoUkd+cl+ZoE15A9o1oQd920Bb0iOJMQkQhl3jNc03YqVjAhG7scf9C5KWRU/R13Orf588uCC6525o02g==';
          assert.equal(after.packages[key]?.version, '2.0.3');
          assert.equal(after.packages[key]?.integrity, expected);
          before.packages[key].integrity = after.packages[key].integrity;
          assert.deepEqual(after, before, 'npm changed lock metadata beyond the single stale integrity field');
          NODE

      - name: Commit npm-generated repair when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo 'Lock integrity already regenerated; nothing to commit.'
            exit 0
          fi
          git config user.name 'shadowgarden-release-bot'
          git config user.email 'shadowgarden-release-bot@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'fix(v2.11): regenerate es6-iterator lock integrity'
          git push origin HEAD:release/v2.11.0-convergence
