name: Finalize v2.1.5

on:
  push:
    branches:
      - fix-search-flex-width-v2.1.5
    paths:
      - .github/workflows/finalize-v2.1.5.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix-search-flex-width-v2.1.5
      - name: Reconcile v2.1.5 metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkgPath = 'package.json';
          const lockPath = 'package-lock.json';
          const changelogPath = 'CHANGELOG.md';
          const version = '2.1.5';

          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.version = version;
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');

          const lock = JSON.parse(fs.readFileSync(lockPath, 'utf8'));
          lock.version = version;
          if (lock.packages?.['']) lock.packages[''].version = version;
          fs.writeFileSync(lockPath, JSON.stringify(lock, null, 2) + '\n');

          let changelog = fs.readFileSync(changelogPath, 'utf8');
          const entry = `## 2.1.5 — Search Flex Width Containment\n- Fixed the remaining long-query Search bar expansion by making the text input the shrinkable flex child instead of giving it 100% width beside the search icon and filter toggle.\n- Preserved fixed space for Search field siblings while constraining long text to the input viewport.\n- Strengthened browser regression coverage to reject a full-width Search input inside the flex row.\n\n`;
          if (!changelog.includes('## 2.1.5 — Search Flex Width Containment')) {
            changelog = changelog.replace('# Shadow Garden Changelog\n\n', '# Shadow Garden Changelog\n\n' + entry);
            fs.writeFileSync(changelogPath, changelog);
          }
          NODE
          git rm .github/workflows/finalize-v2.1.5.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json CHANGELOG.md
          git commit -m 'Finalize v2.1.5 Search flex containment'
          git push origin HEAD:fix-search-flex-width-v2.1.5
