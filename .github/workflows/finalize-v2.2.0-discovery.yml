name: Finalize v2.2.0 discovery

on:
  push:
    paths:
      - ".github/workflows/finalize-v2.2.0-discovery.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature-read-suggestions-random-banners-v2.2.0
      - name: Apply integration edits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"marker not found in {path}: {old[:120]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"marker not unique in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/assets/js/library.js",
              "  let searchTimer=0;\n",
              "  let searchTimer=0;\n  const suggestionRandom=Math.random();\n"
          )
          replace_once(
              "src/assets/js/library.js",
              '''  function renderContinue(){\n    const current=readingStatus.latestActiveEntry(state.items);\n    renderers.renderReadingBanner($("#continuePanel"),document.querySelector(".library-intro"),current,dependencies);\n  }''',
              '''  function renderContinue(){\n    const current=readingStatus.libraryBannerEntry(state.items,suggestionRandom);\n    renderers.renderReadingBanner($("#continuePanel"),document.querySelector(".library-intro"),current,dependencies);\n  }'''
          )

          replace_once(
              "src/assets/js/admin/library-workflow.js",
              '    let bannerChoices=[],bannerSeriesId="",bannerSerial=0;\n',
              '    let bannerChoices=[],bannerSeriesId="",bannerSerial=0,bannerRandomChoice=null;\n'
          )
          replace_once(
              "src/assets/js/admin/library-workflow.js",
              '''        const field=document.createElement("label");field.id="manageBannerField";field.className="admin-field wide manage-banner-field";field.innerHTML='<span>Series banner</span><select id="manageBanner" aria-describedby="manageBannerState"><option value="">Loading volume covers…</option></select><div class="manage-banner-preview"><img id="manageBannerPreview" class="hidden" alt="Selected banner cover preview"><div class="manage-banner-preview-copy"><strong id="manageBannerPreviewTitle">Default banner</strong><small id="manageBannerState" class="manage-banner-state">Defaults to the first volume cover. Changes save immediately.</small></div></div>';manageDescription.before(field);''',
              '''        const field=document.createElement("label");field.id="manageBannerField";field.className="admin-field wide manage-banner-field";field.innerHTML='<span>Series banner</span><select id="manageBanner" aria-describedby="manageBannerState"><option value="">Loading volume covers…</option></select><div class="manage-banner-preview"><img id="manageBannerPreview" class="hidden" alt="Random banner cover preview"><div class="manage-banner-preview-copy"><strong id="manageBannerPreviewTitle">Random banner</strong><small id="manageBannerState" class="manage-banner-state">Random is the default. A volume cover is chosen when the Series page opens.</small></div></div>';manageDescription.before(field);'''
          )
          replace_once(
              "src/assets/js/admin/library-workflow.js",
              '''    function syncBannerPreview(){\n      const select=$("#manageBanner"),image=$("#manageBannerPreview"),title=$("#manageBannerPreviewTitle");if(!select||!image||!title)return;\n      const choice=select.value?bannerChoices.find(item=>item.bookId===select.value):bannerChoices[0];title.textContent=choice?(select.value?bannerLabel(choice):`Default — ${bannerLabel(choice)}`):"No volume cover available";\n      if(choice?.cover){image.src=choice.cover;image.classList.remove("hidden")}else{image.removeAttribute("src");image.classList.add("hidden")}\n    }''',
              '''    function syncBannerPreview(){\n      const select=$("#manageBanner"),image=$("#manageBannerPreview"),title=$("#manageBannerPreviewTitle");if(!select||!image||!title)return;\n      const choice=select.value?bannerChoices.find(item=>item.bookId===select.value):bannerRandomChoice;title.textContent=choice?(select.value?bannerLabel(choice):`Random preview — ${bannerLabel(choice)}`):"Random banner";\n      if(choice?.cover){image.src=choice.cover;image.classList.remove("hidden")}else{image.removeAttribute("src");image.classList.add("hidden")}\n    }'''
          )
          replace_once(
              "src/assets/js/admin/library-workflow.js",
              '''        const data=await client.request(`/admin-api/series-banner?id=${encodeURIComponent(id)}`);if(serial!==bannerSerial)return;bannerSeriesId=data.id||id;bannerChoices=arr(data.choices);select.replaceChildren();\n        const defaultOption=document.createElement("option");defaultOption.value="";defaultOption.textContent=bannerChoices[0]?`Default — ${bannerLabel(bannerChoices[0])}`:"Default — first volume cover";select.append(defaultOption);\n        for(const choice of bannerChoices){const option=document.createElement("option");option.value=choice.bookId;option.textContent=bannerLabel(choice);select.append(option)}\n        select.value=bannerChoices.some(choice=>choice.bookId===data.current)?data.current:"";select.dataset.savedValue=select.value;select.disabled=!bannerChoices.length;syncBannerPreview();bannerState(bannerChoices.length?"Defaults to Volume 1. Select another volume to save it as the banner.":"This series has no volume cover available.");''',
              '''        const data=await client.request(`/admin-api/series-banner?id=${encodeURIComponent(id)}`);if(serial!==bannerSerial)return;bannerSeriesId=data.id||id;bannerChoices=arr(data.choices);const covered=bannerChoices.filter(choice=>choice.cover);const previewPool=covered.length?covered:bannerChoices;bannerRandomChoice=previewPool.length?previewPool[Math.floor(Math.random()*previewPool.length)]:null;select.replaceChildren();\n        const defaultOption=document.createElement("option");defaultOption.value="";defaultOption.textContent="Random — any volume cover";select.append(defaultOption);\n        for(const choice of bannerChoices){const option=document.createElement("option");option.value=choice.bookId;option.textContent=bannerLabel(choice);select.append(option)}\n        select.value=bannerChoices.some(choice=>choice.bookId===data.current)?data.current:"";select.dataset.savedValue=select.value;select.disabled=!bannerChoices.length;syncBannerPreview();bannerState(bannerChoices.length?"Random is the default. A volume cover is chosen when the Series page opens; select a volume to pin it instead.":"This series has no volume cover available.");'''
          )
          replace_once(
              "src/assets/js/admin/library-workflow.js",
              '''      try{const data=await client.request("/admin-api/series-banner",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id:bannerSeriesId,bannerBookId:next})});bannerSeriesId=data.id||bannerSeriesId;select.dataset.savedValue=next;bannerState(next?"Banner saved. This volume cover will be used on the Series page.":"Default restored. The first volume cover will be used.","saved")}''',
              '''      try{const data=await client.request("/admin-api/series-banner",{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({id:bannerSeriesId,bannerBookId:next})});bannerSeriesId=data.id||bannerSeriesId;select.dataset.savedValue=next;bannerState(next?"Banner saved. This volume cover will stay pinned on the Series page.":"Random banner restored. A volume cover will be chosen when the Series page opens.","saved")}'''
          )

          package = json.loads(Path("package.json").read_text())
          package["version"] = "2.2.0"
          Path("package.json").write_text(json.dumps(package, indent=2) + "\n")

          lock = json.loads(Path("package-lock.json").read_text())
          lock["version"] = "2.2.0"
          lock["packages"][""]["version"] = "2.2.0"
          Path("package-lock.json").write_text(json.dumps(lock, indent=2) + "\n")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text()
          heading = "# Shadow Garden Changelog\n\n"
          if not text.startswith(heading):
              raise SystemExit("unexpected changelog heading")
          entry = '''## 2.2.0 — Reading Suggestions & Random Series Banners\n- Kept Continue as the Library banner priority, then suggest the next unread volume when a previously started series has a next volume available.\n- Added a random Read suggestion fallback so Main and Adult Library banners remain useful even when there is no active reading trail.\n- Reused the suggested volume cover as the Library hero artwork and kept the suggestion stable for the current page session.\n- Made Random the default Series banner mode, choosing from available volume covers once per Series page load while preserving explicit pinned banner selections.\n- Updated Garden Keeper Series Banner controls to expose Random as the default choice with a representative random preview.\n- Added unit/DOM/browser regression coverage for suggestion priority, random fallback, random banner selection, and Keeper banner semantics.\n\n'''
          changelog.write_text(heading + entry + text[len(heading):])
          PY

          rm .github/workflows/finalize-v2.2.0-discovery.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/js/library.js src/assets/js/admin/library-workflow.js package.json package-lock.json CHANGELOG.md .github/workflows/finalize-v2.2.0-discovery.yml
          git commit -m "Integrate reading suggestions and random banners for v2.2.0"
          git push origin HEAD:feature-read-suggestions-random-banners-v2.2.0
