name: Reconcile v2.1.0 metadata

on:
  push:
    branches:
      - feature-fan-translation-metadata-v2.1.0
    paths:
      - tools/reconcile-v2.1.0.mjs
      - .github/workflows/reconcile-v2.1.0.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature-fan-translation-metadata-v2.1.0
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Finalize v2.1.0 metadata
        run: node tools/reconcile-v2.1.0.mjs
      - name: Remove one-shot metadata helpers
        run: rm -f tools/reconcile-v2.1.0.mjs .github/workflows/reconcile-v2.1.0.yml
      - name: Commit v2.1.0 metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Finalize v2.1.0 metadata"
          git push origin HEAD:feature-fan-translation-metadata-v2.1.0
