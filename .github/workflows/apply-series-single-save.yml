name: Apply unified Series Editor save

on:
  push:
    branches:
      - fix-series-editor-single-save
    paths:
      - tools/tmp-single-series-save.py
      - .github/workflows/apply-series-single-save.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix-series-editor-single-save
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Apply unified save integration
        run: |
          python3 tools/tmp-single-series-save.py
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --progress=false
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm tools/tmp-single-series-save.py .github/workflows/apply-series-single-save.yml
          git add src functions tests package.json package-lock.json CHANGELOG.md
          git commit -m "Unify Series Editor translation save"
          git push origin HEAD:fix-series-editor-single-save
